    <div id="painel-leitor">

        Copie os comentários do TikTok/Instagram e cole abaixo. O sistema identifica o <b class="text-white">@usuario</b> e o <b class="text-white">país</b> em cada linha automaticamente.

        </button>
        <span id="feedback-processamento" class="text-xs font-semibold text-neutral-400"></span>
      </div>
    </div>

    <!-- MODO 2: Registro Manual (1 por 1) -->
    <div id="painel-manual" class="hidden">
      <form id="torcedor-form" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div>
          <label class="block text-xs font-semibold text-neutral-400 mb-1">@ do Usuário</label>
          <input 
            type="text" 
            id="input-user" 
            placeholder="@exemplo" 
            class="w-full bg-neutral-950 border border-neutral-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-yellow-400 transition"
          >
        </div>

        <div>
          <label class="block text-xs font-semibold text-neutral-400 mb-1">País</label>
          <input 
            list="lista-paises" 
            id="input-pais" 
            placeholder="Digite o país..." 
            class="w-full bg-neutral-950 border border-neutral-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-yellow-400 transition text-white"
          >

        </div>

    // Função de auxílio: Remove acentos para comparação flexível

      return texto.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    }

    // Identifica qual país está no texto da linha
    function detectarPais(linha) {
      const linhaNorm = normalizar(linha);
      for (const p of TODOS_OS_PAISES) {
        const nomeNorm = normalizar(p.nome);
        if (linhaNorm.includes(nomeNorm) || linha.includes(p.bandeira)) {
          return p;
        }
      }
      return null;
    }

      // Evita cadastrar a mesma pessoa no mesmo país mais de uma vez
      const jaExiste = cidadaos.some(c => c.username.toLowerCase() === username.toLowerCase() && c.pais === paisObj.nome);

      const membrosDoPais = cidadaos.filter(c => c.pais === paisObj.nome);
      const isLider = membrosDoPais.length === 0;
      const numero = membrosDoPais.length + 1;

      cidadaos.push({
        id: Date.now() + Math.random(),
        username: username,
        pais: paisObj.nome,
        bandeira: paisObj.bandeira,
        isLider: isLider,
        num: numero
      });
      return true;
    }
